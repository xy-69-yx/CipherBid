name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  contract-compile:
    name: Compile contract
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Compile contract
        run: npm run compile

      - name: Upload compiled contract bundle
        uses: actions/upload-artifact@v4
        with:
          name: compiled-contract
          path: contract/src/managed/cipherbid
          if-no-files-found: error
          retention-days: 1

  frontend-build:
    name: Build frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: contract-compile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Download compiled contract bundle
        uses: actions/download-artifact@v4
        with:
          name: compiled-contract
          path: contract/src/managed/cipherbid

      - name: Sync generated contract assets
        run: npm run sync:assets

      - name: Build frontend
        run: npm run build
