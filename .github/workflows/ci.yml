name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  contract-compile:
    name: Compile contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPACT_DIRECTORY: /tmp/cipherbid-compact-toolchain

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Compact CLI
        env:
          COMPACT_CLI_SHA256: 684c6b3d2eef9484aabba7a0820c166ae5c169f3aecf28cbea2074840263ba66
        run: |
          archive="$RUNNER_TEMP/compact-cli.tar.xz"
          install_dir="$RUNNER_TEMP/compact-cli"
          bin_dir="$RUNNER_TEMP/compact-bin"

          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/midnightntwrk/compact/releases/download/compact-v0.5.1/compact-x86_64-unknown-linux-musl.tar.xz"
          echo "$COMPACT_CLI_SHA256  $archive" | sha256sum --check

          mkdir -p "$install_dir" "$bin_dir"
          tar --extract --xz --file "$archive" --directory "$install_dir" --strip-components=1
          install "$install_dir/compact" "$bin_dir/compact"
          echo "$bin_dir" >> "$GITHUB_PATH"

      - name: Install Compact compiler
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMPACT_GITHUB_TOKEN: ${{ github.token }}
        run: |
          compact update 0.31.1
          compact --version

      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Compile contract
        run: npm run compile

      - name: Run contract tests
        run: npm test

      - name: Upload compiled contract bundle
        uses: actions/upload-artifact@v4
        with:
          name: compiled-contract
          path: contract/src/managed/cipherbid
          if-no-files-found: error
          retention-days: 1

  frontend-build:
    name: Build frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: contract-compile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Download compiled contract bundle
        uses: actions/download-artifact@v4
        with:
          name: compiled-contract
          path: contract/src/managed/cipherbid

      - name: Sync generated contract assets
        run: npm run sync:assets

      - name: Build frontend
        run: npm run build
